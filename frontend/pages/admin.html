<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkLink — Admin Dashboard</title>
    <meta name="description" content="WorkLink Admin — Monitor all feedback and team activity in real time.">
    <link rel="stylesheet" href="../css/style.css">
    <script>
        // IIFE Page Protection Block (Step 8B)
        (function() {
            const currentUserStr = localStorage.getItem("currentUser");
            if (!currentUserStr) {
                window.location.href = "login.html";
                return;
            }
            try {
                const currentUser = JSON.parse(currentUserStr);
                if (currentUser.role !== "admin") {
                    window.location.href = "login.html";
                }
            } catch (e) {
                window.location.href = "login.html";
            }
        })();
    </script>
</head>
<body>
<div class="dashboard-container">

    <!-- =====================================================
         NAVBAR
         ===================================================== -->
    <nav class="navbar">
        <a href="#" class="navbar-brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"
                        stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="brand-name">WorkLink</span>
        </a>

        <!-- Navigation Tabs -->
        <div class="navbar-nav-links">
            <a href="admin.html" class="nav-link active">Dashboard</a>
            <a href="users.html" class="nav-link">Users</a>
        </div>

        <div class="navbar-user-section">
            <span class="user-badge" id="adminEmailBadge">Loading...</span>
            <button id="logoutBtn" class="btn-logout">Logout</button>
        </div>
    </nav>

    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->
    <main class="dashboard-content">

        <!-- Compact Page Header -->
        <div style="margin-bottom: 16px; margin-top: 4px;">
            <h2 style="font-size: 19px; font-weight: 700; color: var(--text-900); display: flex; align-items: center; gap: 8px;">
                ⚙️ Admin Control Panel
            </h2>
            <p style="font-size: 12.5px; color: var(--text-500); margin-top: 1px;">Monitor live metrics and staff feedbacks.</p>
        </div>

        <!-- ─── STATS ROW — 3 horizontal cards ──────────── -->
        <div class="stats-grid">

            <div class="stat-box">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
                            stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-num" id="statTotalFeedbacks">—</span>
                    <span class="stat-label">Total Feedbacks</span>
                </div>
            </div>

            <div class="stat-box">
                <div class="stat-icon" style="background:rgba(99,102,241,0.1);color:#6366F1;">
                    <svg viewBox="0 0 24 24">
                        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zm8 2a4 4 0 11-8 0"
                            stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-num" id="statTotalUsers">—</span>
                    <span class="stat-label">Active Users</span>
                </div>
            </div>

            <div class="stat-box">
                <div class="stat-icon" style="background:rgba(16,185,129,0.1);color:#10B981;">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                            stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-num" id="statTodayFeedbacks">—</span>
                    <span class="stat-label">Today's Feedbacks</span>
                </div>
            </div>

        </div>

        <!-- ─── FEEDBACKS LIST CARD ───────────────────────── -->
        <div class="dashboard-card">
            <h3>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4F46E5"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                All Received Feedbacks
                <span class="count-badge" id="feedbackCountBadge">—</span>
            </h3>

            <!-- Feedback cards injected here by JS -->
            <div id="feedbacksContainer" class="feedback-grid">
                <p class="empty-state">Loading feedback data from Firestore...</p>
            </div>
        </div>

    </main>
</div>

<script>
    // ─── PAGE LOAD ──────────────────────────────────────
    document.addEventListener("DOMContentLoaded", () => {
        const email = localStorage.getItem("userEmail");
        if (!email) { alert("Kripya pehle login karein!"); window.location.href = "login.html"; return; }
        document.getElementById("adminEmailBadge").textContent = email;
        loadFeedbacksAndStats();
    });

    // ─── LOAD FEEDBACKS + CALCULATE STATS ───────────────
    const loadFeedbacksAndStats = async () => {
        const container = document.getElementById("feedbacksContainer");
        const badge     = document.getElementById("feedbackCountBadge");

        try {
            const res  = await fetch("http://localhost:5000/api/feedback");
            const data = await res.json();

            if (res.ok && data.success) {
                const feedbacks = data.feedbacks;

                // Stats
                const total      = feedbacks.length;
                const users      = new Set(feedbacks.map(f => f.userEmail)).size;
                const todayStr   = new Date().toDateString();
                const todayCount = feedbacks.filter(f => new Date(f.createdAt).toDateString() === todayStr).length;

                document.getElementById("statTotalFeedbacks").textContent  = total;
                document.getElementById("statTotalUsers").textContent       = users;
                document.getElementById("statTodayFeedbacks").textContent   = todayCount;
                badge.textContent = `${total} total`;

                if (total === 0) {
                    container.innerHTML = `<p class="empty-state">Abhi tak koi feedback submit nahi hua hai.</p>`;
                    return;
                }

                container.innerHTML = "";
                feedbacks.forEach(item => {
                    const time = new Date(item.createdAt).toLocaleString("en-IN", {
                        day: "2-digit", month: "short", year: "numeric",
                        hour: "2-digit", minute: "2-digit"
                    });
                    const card = document.createElement("div");
                    card.className = "feedback-card-item";
                    card.innerHTML = `
                        <div class="feedback-card-header">
                            <span class="feedback-user">${safe(item.userEmail)}</span>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span class="feedback-date">${time}</span>
                                <button class="btn-delete-user" style="padding: 2px 6px; font-size: 10.5px;" onclick="deleteFeedback('${item.id}')">Delete</button>
                            </div>
                        </div>
                        <p class="feedback-msg">${safe(item.message)}</p>
                    `;
                    container.appendChild(card);
                });

            } else {
                badge.textContent   = "Error";
                container.innerHTML = `<p class="empty-state" style="color:#EF4444;">${data.message || "Could not load feedbacks."}</p>`;
            }

        } catch (err) {
            console.error(err);
            badge.textContent   = "Error";
            container.innerHTML = `<p class="empty-state" style="color:#EF4444;">Server se connect nahi ho pa raha.</p>`;
        }
    };

    // ─── DELETE FEEDBACK FUNCTION ───────────────────────
    // Kaam: Selected feedback ID ko API pe delete request bhejkar remove karega, aur list refresh karega.
    const deleteFeedback = async (feedbackId) => {
        if (!confirm("Are you sure you want to delete this feedback?")) return;

        try {
            const res = await fetch(`http://localhost:5000/api/feedback/${feedbackId}`, {
                method: "DELETE"
            });
            const data = await res.json();

            if (res.ok && data.success) {
                // List aur stats automatic refresh karega
                loadFeedbacksAndStats();
            } else {
                alert(data.message || "Feedback delete karne me issue aaya.");
            }
        } catch (err) {
            console.error(err);
            alert("Server connection error feedback delete karne me.");
        }
    };

    // Global window scope trigger map
    window.deleteFeedback = deleteFeedback;

    // ─── LOGOUT ─────────────────────────────────────────
    document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.clear(); // Safe full storage clean (Step 8B)
        window.location.href = "login.html";
    });

    // ─── XSS SAFETY ─────────────────────────────────────
    function safe(str) {
        const d = document.createElement("div");
        d.appendChild(document.createTextNode(str || ""));
        return d.innerHTML;
    }
</script>
</body>
</html>
